<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>TiTracker — Expenses Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Splash -->
<div id="splash" class="screen center">
  <svg class="wavy" viewBox="0 0 100 100">
    <path id="wavePath" fill="none" stroke-width="3" stroke-linecap="round"/>
  </svg>
</div>

<!-- Login -->
<div id="login" class="screen" hidden></div>

<!-- App -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <div class="greeting" id="greeting">Hello</div>
      <div class="topbar-date" id="topbarDate"></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" data-a="search" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.49-1.5-5-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button class="avatar-btn" data-a="avatar-top" id="avatarTop"></button>
    </div>
  </header>

  <div class="pages">
    <div class="page" id="page"></div>
  </div>

  <nav class="bar" id="nav"></nav>
  <button class="fab" data-a="fab" aria-label="Add" id="fab">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
</div>

<div id="overlay"></div>
<div id="toast"></div>

<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
